name: Daily paper-trade replay

on:
  schedule:
    - cron: "15 11 * * 1-5"   # 16:45 IST, Monday to Friday
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates to replay (YYYY-MM-DD, space separated). Empty = today."
        required: false

permissions:
  contents: write

concurrency: replay

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay
        run: python3 -I engine/papertrade.py ${{ github.event.inputs.dates }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Replay $(TZ=Asia/Kolkata date +%F)"
          git push
